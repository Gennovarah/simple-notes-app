name: Deploy Simple Notes App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        run: echo "IMAGE_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: novarah/simple-notes-backend:v1.0.${{ github.run_number }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: novarah/simple-notes-frontend:v1.0.${{ github.run_number }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/simple-notes-app

            export IMAGE_TAG=v1.0.${{ github.run_number }}

            echo "Deploying version: $IMAGE_TAG"

            docker compose config

            docker compose pull

            docker compose up -d --force-recreate

            echo "Running containers:"
            docker compose ps

            echo "Backend image:"
            docker inspect notes-api --format '{{.Config.Image}}'

            echo "Frontend image:"
            docker inspect notes-frontend --format '{{.Config.Image}}'

            docker image prune -f

            echo "Deployment completed successfully: $IMAGE_TAG"
